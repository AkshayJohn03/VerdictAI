[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "verdictai"
version = "0.1.0"
description = "LLM-as-Judge with human calibration, eval dataset generation, and regression detection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Akshay John Xavier" }]
keywords = [
  "llm",
  "evaluation",
  "llm-as-judge",
  "calibration",
  "isotonic-regression",
  "regression-detection",
  "benchmark",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pytest>=8.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "ruff>=0.4",
]

[project.scripts]
verdict = "verdictai.cli:main"

[project.urls]
Homepage = "https://github.com/AkshayJohn03/VerdictAI"
Repository = "https://github.com/AkshayJohn03/VerdictAI"

[tool.hatch.build.targets.wheel]
packages = ["src/verdictai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["pydantic.Field", "pydantic.fields.Field"]
